<div class="page">
  <div class="searchbar">
    <div class="searchbar__inner">
      <span class="searchbar__wrapper">
        <ng-icon class="searchbar__icon" name="heroMagnifyingGlass" />
        <input class="searchbar__input" type="text" placeholder="{{ 'MAIN_PAGE.searchbar' | translate }}" />
      </span>
      <button class="searchbar__btn">{{ 'MAIN_PAGE.search' | translate }}</button>
    </div>
  </div>
  <div class="sort">
    <button class="sort__btn">
      {{ 'MAIN_PAGE.sort' | translate }}
    </button>
  </div>
  @for (item of posts(); track item.id) {
    <app-post-component [data]="item" [isFullView]="false" />
  } @empty {
    <p class="empty">{{ 'MAIN_PAGE.no-posts' | translate }}</p>
  }
</div>
