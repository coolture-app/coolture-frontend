<div class="page">
  <div class="searchbar">
    <div class="searchbar__inner">
      <span class="searchbar__wrapper">
        <ng-icon class="searchbar__icon" name="heroMagnifyingGlass" />
        <input
          class="searchbar__input"
          type="text"
          [formControl]="searchControl"
          placeholder="{{ 'MAIN_PAGE.searchbar' | translate }}"
        />
      </span>
      <button class="searchbar__btn">{{ 'MAIN_PAGE.search' | translate }}</button>
      @if (authService.isAuthenticated()) {
        <button class="addPost-btn" (click)="goToAddPost()">
          <ng-icon name="heroPlus" />
          <span class="addPost-btn__text">{{ 'MAIN_PAGE.addPost' | translate }}</span>
        </button>
      }
    </div>
  </div>
  <div class="sort">
    <button class="sort__btn">
      {{ 'MAIN_PAGE.sort' | translate }}
    </button>
  </div>
  @for (item of posts().items; track item.id) {
    <app-post-component (deleteRequest)="removeChild($event)" [data]="item" [isFullView]="false" />
  } @empty {
    <p class="empty">{{ 'MAIN_PAGE.no-posts' | translate }}</p>
  }
</div>
