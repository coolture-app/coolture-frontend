@let f = form();
<div class="filters">
  <div class="filters__header">
    <span class="filters__title">{{ 'MAIN_PAGE.filters' | translate }}</span>
    <app-btn variant="plain" size="sm" (btnClick)="clear.emit()">
      <ng-icon name="heroXMark" /> {{ 'MAIN_PAGE.clear' | translate }}
    </app-btn>
  </div>

  <div class="filters__row">
    <div class="filters__field">
      <label for="type">{{ 'MAIN_PAGE.type' | translate }}</label>
      <select id="type" [formControl]="f.controls.type">
        <option value="">{{ 'MAIN_PAGE.allTypes' | translate }}</option>
        <option value="OFFLINE">{{ 'MAIN_PAGE.offline' | translate }}</option>
        <option value="ONLINE">{{ 'MAIN_PAGE.online' | translate }}</option>
      </select>
    </div>

    <div class="filters__field">
      <label for="tags">{{ 'MAIN_PAGE.tags' | translate }}</label>
      <input
        id="tags"
        type="text"
        [formControl]="f.controls.tags"
        placeholder="{{ 'MAIN_PAGE.tagsPlaceholder' | translate }}"
      />
    </div>
  </div>

  <div class="filters__row">
    <div class="filters__field">
      <label for="startsFrom">{{ 'MAIN_PAGE.startsFrom' | translate }}</label>
      <input id="startsFrom" type="datetime-local" [formControl]="f.controls.startsFrom" />
    </div>

    <div class="filters__field">
      <label for="startsTo">{{ 'MAIN_PAGE.startsTo' | translate }}</label>
      <input id="startsTo" type="datetime-local" [formControl]="f.controls.startsTo" />
    </div>
  </div>

  <div class="filters__switches">
    @if (signedIn()) {
      <div class="filters__switch">
        <span aria-hidden="true">{{ 'MAIN_PAGE.followed' | translate }}</span>
        <app-switch
          [formControl]="f.controls.followed"
          [label]="'MAIN_PAGE.followed' | translate"
        ></app-switch>
      </div>
    }
    <div class="filters__switch">
      <span aria-hidden="true">{{ 'MAIN_PAGE.includePast' | translate }}</span>
      <app-switch
        [formControl]="f.controls.includePast"
        [label]="'MAIN_PAGE.includePast' | translate"
      ></app-switch>
    </div>
  </div>

  <div class="filters__footer">
    <app-btn variant="primary" (btnClick)="done.emit()">{{ 'MAIN_PAGE.done' | translate }}</app-btn>
  </div>
</div>
