<div class="page">
  <button class="back" (click)="goBack()" (keydown.enter)="goBack()" role="button" tabindex="0">
    {{ 'FULL_POST.back' | translate }}
  </button>
  @if (post(); as postData) {
    <app-post-component [data]="postData" [isFullView]="true" />
    <div #commentSection class="comments">
      @for (item of comments; track $index) {
        <app-comment-component [comment]="item" />
      }
    </div>
    <div class="commentfield" [class.sticky]="isCommentFocused()">
      <textarea
        #commentInput
        rows="1"
        name="comment"
        placeholder="{{ 'FULL_POST.comment-placeholder' | translate }}"
        (input)="checkIfResize()"
        [(ngModel)]="commentContent"
        (focus)="isCommentFocused.set(true)"
        (blur)="isCommentFocused.set(false)"
      ></textarea>
      <button (click)="addComment()">{{ 'FULL_POST.comment-btn' | translate }}</button>
    </div>
  }
</div>
