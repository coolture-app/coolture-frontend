<div class="page">
  <app-btn variant="secondary" (btnClick)="goBack()">
    {{ 'FULL_POST.back' | translate }}
  </app-btn>
  @if (post()) {
    <app-post-component
      (deleteRequest)="removeChild($event)"
      [data]="post()!"
      [isFullView]="true"
    />
    <section #commentSection id="comments" class="comments" aria-labelledby="comments-title">
      <h2 id="comments-title" class="comments__title">
        {{ 'COMMENT.title' | translate }} ({{ post()!.commentsCount || 0 }})
      </h2>
      <app-comment-thread [postId]="post()!.id" (countChange)="changeCount($event)" />
    </section>
  }
</div>
