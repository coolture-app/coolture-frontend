<div class="page">
  <app-btn variant="secondary" (btnClick)="goBack()">
    {{ 'FULL_POST.back' | translate }}
  </app-btn>
  @if (post()) {
    <app-post-component
      (deleteRequest)="removeChild($event)"
      [data]="post()!"
      [isFullView]="true"
    />
    <div #commentSection class="comments">
      @for (item of comments(); track $index) {
        <app-comment-component
          [comment]="item"
          (replyClicked)="setReplyTo($event)"
          (commentDeleted)="onCommentDeleted($event)"
        />
      }
    </div>
    <div
      class="commentfield-container"
      [class.sticky]="isCommentFocused() || parentCommentId !== null"
    >
      @if (parentCommentId) {
        <div class="reply-indicator">
          <span class="reply-indicator__text"
            >{{ 'FULL_POST.replying-to' | translate }} {{ this.parentUsername }}</span
          >
          <app-btn
            variant="icon"
            size="sm"
            (btnClick)="parentCommentId = null; parentUsername = null"
          >
            ✕
          </app-btn>
        </div>
      }
      <div class="commentfield">
        <textarea
          #commentInput
          rows="1"
          name="comment"
          placeholder="{{ 'FULL_POST.comment-placeholder' | translate }}"
          (input)="checkIfResize()"
          [(ngModel)]="commentContent"
          (focus)="isCommentFocused.set(true)"
          (blur)="isCommentFocused.set(false)"
        ></textarea>
        <app-btn variant="primary" (btnClick)="addComment()">
          {{ 'FULL_POST.comment-btn' | translate }}
        </app-btn>
      </div>
    </div>
  }
</div>
