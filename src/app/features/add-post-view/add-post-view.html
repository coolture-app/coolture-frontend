<div class="add-post-container">
  <!-- TODO ADD TRANSLATION -->
  <div class="add-post-card">
    <header class="card-header">
      <h2>Dodaj nowe wydarzenie</h2>
      <p>Wypełnij formularz, aby opublikować nowy post.</p>
    </header>

    <form [formGroup]="postForm" (ngSubmit)="onSubmit()" class="post-form">
      <div class="form-group">
        <label for="title">Tytuł wydarzenia</label>
        <input id="title" type="text" formControlName="title" placeholder="Wpisz tytuł..." />
        <span
          class="error"
          *ngIf="postForm.get('title')?.invalid && postForm.get('title')?.touched"
        >
          Tytuł jest wymagany (3-200 znaków).
        </span>
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label for="categoryId">Kategoria</label>
          <select id="categoryId" formControlName="categoryId">
            <option value="" disabled selected>Wybierz kategorię</option>
            <option *ngFor="let category of categories$ | async" [value]="category.id">
              {{ category.name }}
            </option>
          </select>
          <span
            class="error"
            *ngIf="postForm.get('categoryId')?.invalid && postForm.get('categoryId')?.touched"
          >
            Kategoria jest wymagana.
          </span>
        </div>

        <div class="form-group half">
          <label for="type">Typ wydarzenia</label>
          <select id="type" formControlName="type">
            <option value="ONLINE">Online</option>
            <option value="OFFLINE">Offline</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="startsAt">Data i godzina rozpoczęcia</label>
        <input id="startsAt" type="datetime-local" formControlName="startsAt" />
        <span
          class="error"
          *ngIf="postForm.get('startsAt')?.invalid && postForm.get('startsAt')?.touched"
        >
          Data wydarzenia jest wymagana.
        </span>
      </div>

      <div class="form-group">
        <label for="description">Opis wydarzenia</label>
        <textarea
          id="description"
          formControlName="description"
          rows="5"
          placeholder="Opisz swoje wydarzenie..."
        ></textarea>
        <span
          class="error"
          *ngIf="postForm.get('description')?.invalid && postForm.get('description')?.touched"
        >
          Opis jest wymagany (do 2000 znaków).
        </span>
      </div>

      <div class="form-group media-upload-group">
        <label for="mediaUploadBtn">Zdjęcia</label>
        <button
          type="button"
          id="mediaUploadBtn"
          class="media-upload-area"
          (click)="fileInput.click()"
        >
          <div class="upload-placeholder">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span>Kliknij, aby dodać zdjęcia</span>
          </div>
        </button>
        <input
          #fileInput
          type="file"
          multiple
          accept="image/*"
          (change)="onFilesSelected($event)"
          hidden
        />

        <div class="media-preview-grid" *ngIf="mediaPreviews.length > 0">
          <div class="preview-item" *ngFor="let preview of mediaPreviews; let i = index">
            <img [src]="preview.previewUrl" [alt]="preview.file.name" />
            <div class="upload-overlay" *ngIf="preview.isUploading">
              <span class="spinner"></span>
            </div>
            <button
              type="button"
              class="remove-btn"
              (click)="removeMedia(i)"
              *ngIf="!preview.isUploading"
              title="Usuń zdjęcie"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="submit-btn" [disabled]="postForm.invalid || isSubmitting">
          {{ isSubmitting ? 'Zapisywanie...' : 'Opublikuj wydarzenie' }}
        </button>
      </div>
    </form>
  </div>
</div>
