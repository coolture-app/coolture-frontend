<div class="my-events">
  <div class="my-events__filters">
    <app-btn
      variant="secondary"
      size="sm"
      [class]="selectedFilter() === 'all' ? 'active' : ''"
      (btnClick)="setFilter('all')"
    >
      {{ 'MY_EVENTS.all' | translate }}
    </app-btn>
    <app-btn
      variant="secondary"
      size="sm"
      [class]="selectedFilter() === 'INTERESTED' ? 'active' : ''"
      (btnClick)="setFilter('INTERESTED')"
    >
      {{ 'MY_EVENTS.interested' | translate }}
    </app-btn>
    <app-btn
      variant="secondary"
      size="sm"
      [class]="selectedFilter() === 'TAKES_PART' ? 'active' : ''"
      (btnClick)="setFilter('TAKES_PART')"
    >
      {{ 'MY_EVENTS.takes_part' | translate }}
    </app-btn>
  </div>

  <div class="my-events__list">
    @if (posts().items.length === 0) {
      <p class="my-events__empty">{{ 'MY_EVENTS.no-events' | translate }}</p>
    } @else {
      @for (post of posts().items; track post.id) {
        <app-event-card [post]="post" (cardClick)="goToPost($event)" />
      }
    }
  </div>
</div>
