@if (notFound()) {
  <app-not-found-view />
} @else {
  <div class="edit-post-container">
    <app-back-link [fallback]="'/posts/' + postId" />
    @if (currentPost(); as post) {
      <div class="edit-post-card">
        <header class="card-header">
          <h2>{{ 'EDIT_POST.title' | translate }}</h2>
          <p>{{ 'EDIT_POST.header-desc' | translate }}</p>
        </header>

        <app-post-form
          mode="edit"
          [initialData]="post"
          [existingMedia]="existingMedia()"
          (formSubmit)="onFormSubmit($event)"
        ></app-post-form>
      </div>
    } @else {
      <app-load-state [failed]="failed()" message="POST.loadFailed" (retry)="load()" />
    }
  </div>
}
