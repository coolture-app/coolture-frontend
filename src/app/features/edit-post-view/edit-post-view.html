<div class="edit-post-container" *ngIf="currentPost()">
  <div class="edit-post-card">
    <header class="card-header">
      <h2>{{ 'EDIT_POST.header-title' | translate }}</h2>
      <p>{{ 'EDIT_POST.header-desc' | translate }}</p>
    </header>

    <app-post-form
      mode="edit"
      [initialData]="currentPost()!"
      [existingMedia]="existingMedia()"
      (formSubmit)="onFormSubmit($event)"
    ></app-post-form>
  </div>
</div>
