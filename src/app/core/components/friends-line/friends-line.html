@if (stances(); as friends) {
  @let going =
    friends.going ? ('POST.friendsGoing' | translate: { names: names(friends.going) }) : '';
  @let interested =
    friends.interested
      ? ('POST.friendsInterested' | translate: { names: names(friends.interested) })
      : '';
  <button
    type="button"
    class="friends"
    aria-haspopup="dialog"
    [attr.aria-label]="going && interested ? going + ' · ' + interested : going || interested"
    (click)="opened.emit()"
  >
    @for (group of groups(); track group.key) {
      @if (!$first) {
        <span class="friends__dot" aria-hidden="true">·</span>
      }
      <span class="friends__group" [class]="'friends__group--' + group.key" aria-hidden="true">
        <ng-icon class="friends__icon" [name]="group.icon" />
        <span class="friends__faces">
          @for (friend of group.stance.people; track friend.id) {
            @if (friend.avatarUrl) {
              <img class="friends__face" [src]="friend.avatarUrl" alt="" loading="lazy" />
            } @else {
              <span class="friends__face friends__face--initials">{{ friend | initials }}</span>
            }
          }
        </span>
        <span class="friends__names">{{ names(group.stance) }}</span>
      </span>
    }
  </button>
}
