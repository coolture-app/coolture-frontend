<div class="comment-container">
  <div class="comment-main">
    <img [src]="comment.author.avatarUrl" alt="" class="author-avatar" />
    <div class="comment-content">
      <div class="author-username">{{ comment.author.username }}</div>
      <div class="text">{{ comment.content }}</div>
      <div class="likes">{{ comment.likesCount }} polubień</div>
    </div>
  </div>

  @if (comment.comments && comment.comments.length > 0) {
    <div class="replies">
      @for (reply of comment.comments; track reply.id) {
        <app-comment-component [comment]="reply" />
      }
    </div>
  }
</div>
