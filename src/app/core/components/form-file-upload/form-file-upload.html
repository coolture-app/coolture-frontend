<div class="form-file-upload">
  <label *ngIf="label" for="fileUploadInput" class="form-file-upload__label">
    {{ label }}
    <span *ngIf="!required" class="form-file-upload__optional">{{ optionalLabel | translate }}</span>
  </label>

  <div
    class="form-file-upload__dropzone"
    [class.form-file-upload__dropzone--drag-over]="isDragOver"
    [class.form-file-upload__dropzone--disabled]="disabled"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    (click)="triggerFileInput()"
    (keydown.enter)="triggerFileInput()"
    (keydown.space)="triggerFileInput(); $event.preventDefault()"
    tabindex="0"
    role="button"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="32"
      height="32"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="form-file-upload__icon"
    >
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <circle cx="8.5" cy="8.5" r="1.5"></circle>
      <polyline points="21 15 16 10 5 21"></polyline>
    </svg>
    <span class="form-file-upload__text">{{ buttonText | translate }}</span>
    <span class="form-file-upload__hint">{{ 'POST_FORM.media-drag-hint' | translate }}</span>
  </div>

  <input
    #fileInput
    id="fileUploadInput"
    type="file"
    [accept]="accept"
    [multiple]="multiple"
    (change)="onFilesSelected($event)"
    hidden
  />
</div>
