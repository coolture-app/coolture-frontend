@if (sheet.post(); as post) {
  <div class="sheet__scrim" aria-hidden="true" (click)="close()"></div>
  <div
    #panel
    class="sheet"
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    aria-labelledby="comments-sheet-title"
    cdkTrapFocus
    [class.sheet--full]="size() === 'full'"
    [class.sheet--dragging]="dragHeight() !== null"
    [style.height.px]="dragHeight()"
  >
    <div
      class="sheet__header"
      (pointerdown)="onDragStart($event)"
      (pointermove)="onDragMove($event)"
      (pointerup)="onDragEnd()"
      (pointercancel)="onDragEnd()"
    >
      <span class="sheet__handle" aria-hidden="true"></span>
      <h2 id="comments-sheet-title" class="sheet__title">
        {{ 'COMMENT.title' | translate }} ({{ sheet.count() }})
      </h2>
      <button
        type="button"
        class="sheet__close"
        [appTooltip]="'COMMENT.close' | translate"
        (pointerdown)="$event.stopPropagation()"
        (click)="close()"
      >
        <ng-icon name="lucideX" />
      </button>
    </div>
    <app-comment-thread
      [postId]="post.id"
      [inSheet]="true"
      (countChange)="sheet.changeCount($event)"
      (composerFocused)="grow()"
    />
  </div>
}
