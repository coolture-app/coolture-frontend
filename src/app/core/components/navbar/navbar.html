<nav class="navbar">
  <h1 class="navbar__title">
    <a routerLink="/">COOLTURE</a>
  </h1>
  <!-- One list of links: in the top bar on wider screens, a bar at the bottom on phones. -->
  <div class="navbar__links">
    @for (link of links; track link.path) {
      <a
        class="navbar__link"
        [class.navbar__link--add]="link.path === '/posts/new'"
        [routerLink]="link.path"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="activeOptions(link.path)"
        [appTooltip]="link.labelKey | translate"
        (click)="link.path === '/' && homeTapped($event)"
      >
        <ng-icon [name]="link.icon" />
      </a>
    }
  </div>
  <span class="navbar__actions">
    <app-btn
      variant="secondary"
      size="sm"
      [label]="'NAVBAR.switch-language' | translate"
      (btnClick)="changeLanguage()"
    >
      {{ currentLang() === 'pl' ? 'EN' : 'PL' }}
    </app-btn>
    @if (authService.isAuthenticated()) {
      <app-btn
        variant="secondary"
        size="sm"
        [label]="'NAVBAR.logout' | translate"
        (btnClick)="logout()"
      >
        <ng-icon class="navbar__action-icon" name="lucideLogOut" />
        <span class="navbar__action-label">{{ 'NAVBAR.logout' | translate }}</span>
      </app-btn>
    } @else {
      <app-btn
        variant="primary"
        size="sm"
        [label]="'NAVBAR.login' | translate"
        (btnClick)="login()"
        >{{ 'NAVBAR.login' | translate }}</app-btn
      >
    }
  </span>
</nav>
