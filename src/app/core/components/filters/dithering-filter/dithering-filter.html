<svg style="position: absolute; width: 0; height: 0; pointer-events: none">
  <filter [id]="uniqueId" color-interpolation-filters="sRGB">
    <feColorMatrix
      type="matrix"
      values="  0.33 0.33 0.33 0 0 
                0.33 0.33 0.33 0 0 
                0.33 0.33 0.33 0 0 
                0    0    0    1 0"
      result="gray"
    />

    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="1" result="noise" />

    <feComposite
      in="gray"
      in2="noise"
      operator="arithmetic"
      k1="0"
      k2="1"
      [attr.k3]="intensity"
      k4="-0.5"
      result="mixed"
    />

    <feComponentTransfer result="binary">
      <feFuncR type="discrete" tableValues="0 1"></feFuncR>
      <feFuncG type="discrete" tableValues="0 1"></feFuncG>
      <feFuncB type="discrete" tableValues="0 1"></feFuncB>
    </feComponentTransfer>

    <feColorMatrix type="matrix" [attr.values]="colorMatrix()" />
  </filter>
</svg>

<div [style.filter]="'url(#' + uniqueId + ')'">
  <ng-content></ng-content>
</div>
