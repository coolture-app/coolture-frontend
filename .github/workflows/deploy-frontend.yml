---
name: Deploy Frontend

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches:
      - "dev"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy frontend with Docker Compose
    runs-on: [self-hosted, linux, host, deployer]
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    env:
      DEPLOY_DIR: /home/admin/coolture/dev/frontend
      BRANCH: dev

    steps:
      - name: Fix git safe directory
        run: git config --global --add safe.directory "$DEPLOY_DIR"

      - name: Update deploy repository
        run: |
          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            echo "Missing git repository in $DEPLOY_DIR"
            exit 1
          fi

          git -C "$DEPLOY_DIR" fetch --all --prune
          git -C "$DEPLOY_DIR" checkout "$BRANCH"
          git -C "$DEPLOY_DIR" reset --hard "origin/$BRANCH"
          git -C "$DEPLOY_DIR" clean -fd
      - name: Tear down existing stack
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker-compose -f ${{ env.DEPLOY_DIR }}/docker-compose.yml down

      - name: Deploy frontend stack
        run: docker-compose up --build -d
        working-directory: /home/admin/coolture/dev/frontend
